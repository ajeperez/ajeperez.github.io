<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Alexandre J.E. Perez</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #05050d;
  color: #e2dfd6;
  font-family: 'EB Garamond', Georgia, serif;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
}
.box {
  text-align: center;
  max-width: 520px;
}
.code {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #818cf8;
  opacity: 0.7;
  margin-bottom: 16px;
}
.title {
  font-size: clamp(36px, 6vw, 56px);
  font-weight: 400;
  line-height: 1;
  margin-bottom: 12px;
}
.title em {
  color: #818cf8;
  font-style: italic;
}
.desc {
  font-size: 17px;
  line-height: 1.7;
  color: rgba(226, 223, 214, 0.6);
  font-style: italic;
  margin-bottom: 32px;
}
.btn {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 10px 22px;
  border-radius: 20px;
  border: 1px solid rgba(129, 140, 248, 0.4);
  color: #818cf8;
  text-decoration: none;
  display: inline-block;
  transition: all 0.2s;
}
.btn:hover {
  background: rgba(129, 140, 248, 0.08);
  border-color: #818cf8;
  color: #c7d0ff;
}
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, #818cf8, transparent);
  opacity: 0.3;
  margin: 32px auto;
  max-width: 280px;
}
</style>
</head>
<body>
<div class="box">
  <p class="code" data-en="Error 404 — Page not found" data-fr="Erreur 404 — Page non trouvée">Error 404 — Page not found</p>
  <h1 class="title">«<em data-en="No path" data-fr="Aucun chemin">No path</em>»</h1>
  <div class="divider"></div>
  <p class="desc"
     data-en="The page you are looking for does not exist in &lt;em&gt;H_φ&lt;/em&gt;.&lt;br&gt;It may be in another level of the Fibonacci sequence."
     data-fr="La page que vous cherchez n'existe pas dans &lt;em&gt;H_φ&lt;/em&gt;.&lt;br&gt;Elle est peut-être dans un autre niveau de la suite de Fibonacci.">
    The page you are looking for does not exist in <em>H_φ</em>.<br>It may be in another level of the Fibonacci sequence.
  </p>
  <a href="/" class="btn" data-en="Back to home" data-fr="Retour à l'accueil">Back to home</a>
</div>

<script>
(function() {
  var lang = localStorage.getItem('lang') || 'en';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-en]').forEach(function(el) {
    var content = el.dataset[lang] || el.dataset.en;
    if (content.indexOf('<') !== -1) {
      el.innerHTML = content;
    } else {
      el.textContent = content;
    }
  });
})();
</script>
</body>
</html>
